name: portfolioproject
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  countup: ^0.1.4
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  responsive_builder: ^0.7.1
  smooth_page_indicator: ^3.0.0
  url_launcher: ^6.1.12

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/files/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash.png
  image_web: assets/splash.png
  web_image_mode: contain

  android_12:
    color: "#FFFFFF"
    image: assets/splash.png

  web: true
  ios: true
  android: true
